<!DOCTYPE html>
<html>

<head>
    <title>Product Details - My Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <h1>🛍️ My Marketplace</h1>

        <div class="nav-links">

            <a href="index.html">
                🏠 Home
            </a>

            <a href="favorites.html">
                ❤️ Favorites
                <span id="favoritesCount">0</span>
            </a>

            <a href="cart.html">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>

            <a href="order-history.html">
                📦 Orders
            </a>

            <a href="login.html">
                👤 Login
            </a>

            <a href="sell.html">
                ➕ Sell
            </a>

        </div>

    </nav>


    <h1>👀 Product Details</h1>


    <!-- PRODUCT DETAILS -->

    <div id="productDetails" class="products"></div>


    <!-- RATING -->

    <div class="product">

        <h2>⭐ Rate This Product</h2>

        <select id="productRating">

            <option value="0">
                Choose a rating
            </option>

            <option value="1">
                ⭐ 1 Star
            </option>

            <option value="2">
                ⭐⭐ 2 Stars
            </option>

            <option value="3">
                ⭐⭐⭐ 3 Stars
            </option>

            <option value="4">
                ⭐⭐⭐⭐ 4 Stars
            </option>

            <option value="5">
                ⭐⭐⭐⭐⭐ 5 Stars
            </option>

        </select>

        <button
            type="button"
            onclick="rateProduct()"
        >
            Submit Rating
        </button>

        <div id="ratingResult"></div>

    </div>


    <br>


    <a href="index.html">

        <button type="button">
            🏠 Back to Marketplace
        </button>

    </a>


    <footer class="footer">

        <p>
            🛍️ My Marketplace
        </p>

        <p>
            Buy • Sell • Discover
        </p>

        <p>
            © 2026 My Marketplace
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
