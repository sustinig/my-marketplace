<!DOCTYPE html>
<html>
<head>
    <title>My Profile - My Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">

        <h1>🛍️ My Marketplace</h1>

        <div class="nav-links">

            <a href="index.html">
                🏠 Home
            </a>

            <a href="favorites.html">
                ❤️ Favorites
                <span id="favoritesCount">0</span>
            </a>

            <a href="cart.html">
                🛒 Cart
                <span id="cartCount">0</span>
            </a>

            <a href="order-history.html">
                📦 Orders
            </a>

            <a href="profile.html">
                👤 Profile
            </a>

            <a href="sell.html">
                ➕ Sell
            </a>

        </div>

    </nav>


    <!-- PROFILE TITLE -->

    <h1>👤 My Profile</h1>


    <!-- ACCOUNT INFORMATION -->

    <div class="product">

        <h2>Account Information</h2>

        <p>
            <strong>Name:</strong>
            <span id="profileName">
                Loading...
            </span>
        </p>

        <p>
            <strong>Email:</strong>
            <span id="profileEmail">
                Loading...
            </span>
        </p>

        <p>
            <strong>Status:</strong>
            <span id="profileStatus">
                Loading...
            </span>
        </p>

    </div>


    <br>


    <!-- EDIT PROFILE -->

    <div class="product">

        <h2>✏️ Edit Profile</h2>

        <label for="editName">
            Name
        </label>

        <br>

        <input
            id="editName"
            type="text"
            placeholder="Your name"
        >

        <br><br>


        <label for="editEmail">
            Email
        </label>

        <br>

        <input
            id="editEmail"
            type="email"
            placeholder="Your email"
        >

        <br><br>


        <label for="editPassword">
            New Password
        </label>

        <br>

        <input
            id="editPassword"
            type="password"
            placeholder="New password"
        >

        <br><br>


        <button
            type="button"
            onclick="updateProfile()"
        >
            💾 Save Changes
        </button>

    </div>


    <br>


    <!-- ACCOUNT ACTIONS -->

    <div class="product">

        <h2>⚙️ Account Actions</h2>

        <button
            type="button"
            onclick="logoutUser()"
        >
            🚪 Logout
        </button>

        <button
            type="button"
            onclick="deleteAccount()"
        >
            🗑️ Delete Account
        </button>

    </div>


    <br>


    <!-- BACK BUTTON -->

    <a href="index.html">

        <button type="button">
            🏠 Back to Marketplace
        </button>

    </a>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            🛍️ My Marketplace
        </p>

        <p>
            Buy • Sell • Discover
        </p>

        <p>
            © 2026 My Marketplace
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
